[package]
name = "ikea-server-schema"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
autobins = false

[lib]
name = "ikea_server_schema"
path = "src/lib.rs"

[[bin]]
name = "ikea-server-schema"
path = "src/main.rs"

[workspace]

[dependencies]
thiserror = "=2.0.20"
indexmap = {version="2.12",features=["serde"]}
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
mlua = { version = "=0.11.6", features = ["lua54", "vendored", "serialize", "anyhow"] }
kfc = { path = "E:/Build/hdmap-prepared-origin-20261102-r2/source/dependency/kfc-parser/crates/kfc", features = ["resource"] }

[profile.release]
debug = 0
incremental = false
strip = true
